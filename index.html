  <script>    function showFatal(msg) {
      try {
        var box = document.getElementById('appErrorBox');
        if (!box) {
          box = document.createElement('div');
          box.id = 'appErrorBox';
          box.style = 'padding:20px;font-family:Arial,\'Helvetica Neue\',Helvetica,sans-serif;background:#fff0f0;color:#800;border:2px solid #f5c2c2;';
          document.body.insertBefore(box, document.body.firstChild);
        }
        box.innerText = '应用加载错误：' + String(msg) + '\n(详见控制台)';
      } catch (e) {
        console.error('Failed to render error box', e);
      }
    }
    window.addEventListener('error', function (e) {
      console.error('Uncaught error', e.error || e.message || e);
      showFatal(e.error ? (e.error.stack || e.error.message) : (e.message || String(e)));
    });
    window.addEventListener('unhandledrejection', function (e) {
      console.error('Unhandled rejection', e.reason || e);
      showFatal(e.reason ? (e.reason.stack || e.reason.message || e.reason) : String(e));
    });
    console.log('Starting app (protected mode)...');

  // let mascotIndex = 0; // 表情切换已停用
  function toggleMascotExpression() {
    const toast = document.getElementById('mascotToast');
    if (!toast) return;
    // 从 localStorage 读取当前语言
    const lang = localStorage.getItem('cmb_lang') || 'zh';
    // 根据当前页面选择不同的消息
    const hash = location.hash || '';
    let pageType = 'home';
    if (hash.startsWith('#/currency/')) pageType = 'currency';
    else if (hash.startsWith('#/branch/')) pageType = 'branch';
    const pageMsgs = mascotMessages[lang] ? mascotMessages[lang][pageType] : null;
    const msgs = pageMsgs || mascotMessages.zh.home;
    const msg = msgs[Math.floor(Math.random() * msgs.length)];
    toast.textContent = msg;
    toast.classList.add('show');
    // 3秒后隐藏
    clearTimeout(window._mascotToastTimer);
    window._mascotToastTimer = setTimeout(() => {
      toast.classList.remove('show');
    }, 3000);
  }
  // 绑定小招喵点击事件（兼容安卓触摸）
  document.addEventListener('DOMContentLoaded', function() {
    const mascot = document.getElementById('mascotFixed');
    if (mascot) {
      mascot.addEventListener('click', toggleMascotExpression);
      mascot.addEventListener('touchstart', function(e) {
        e.preventDefault();
        toggleMascotExpression();
      }, { passive: false });
    }
  });</script>

              isRefreshing = false;
              pullDistance = 0;
            }, 500);
          }, 800);
        } else {
          pullEl.style.height = '0';
          pullDistance = 0;
        }
      });
    }
    backBtn.addEventListener('click', () => {
      if (history.length > 1) history.back();
      else location.hash = '#/';
    });
    document.getElementById('langBtn').addEventListener('click', toggleLang);
    function showBack(visible) { backBtn.style.display = visible ? 'inline-block' : 'none'; }
    function escapeHtml(text) {
      if (!text && text !== 0) return '';
      return String(text).replace(/[&<>\"']/g, function (s) {
        return ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'})[s];
      });
    }
    function formatHours(hours) {
      if (!hours) return t('pleaseConfirm');
      const parts = [];
      if (hours.weekdays && hours.weekdays.open && hours.weekdays.close) {
        parts.push(`${t('monFri')} ${hours.weekdays.open} - ${hours.weekdays.close}`);
      }
      if (hours.saturday && hours.saturday.open && hours.saturday.close) {
        parts.push(`${t('saturday')} ${hours.saturday.open} - ${hours.saturday.close}`);
      } else {
        parts.push(`${t('saturday')} ${t('closed')}`);
      }
      if (hours.sunday && hours.sunday.open && hours.sunday.close) {
        parts.push(`${t('sunday')} ${hours.sunday.open} - ${hours.sunday.close}`);
      } else {
        parts.push(`${t('sunday')} ${t('closed')}`);
      }
      return currentLang === 'zh' ? parts.join('； ') : parts.join('; ');
    }
    function haversine(lat1, lon1, lat2, lon2) {
      const toRad = x => x * Math.PI / 180;
      const R = 6371000;
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);
      const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon/2)**2;
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c;
    }
    // 深圳地理边界：过滤掉解析到外地的错误坐标
    function isInShenzhen(lat, lon) {
      return lat >= 22.45 && lat <= 22.87 && lon >= 113.75 && lon <= 114.65;
    }
    function renderHome() {
      document.title = t('appTitle');
      root.innerHTML = '';
      const wrapper = document.createElement('div');
      wrapper.innerHTML = `<div class="section-title">${t('currencySelect')}</div>`;
      const grid = document.createElement('div');
      grid.className = 'list';
      data.currencies.forEach(c => {
        const btn = document.createElement('button');
        btn.className = 'btn';
        btn.textContent = currentLang === 'zh' ? c.name : (c.nameEn || c.name);
        btn.onclick = () => { location.hash = '#/currency/' + encodeURIComponent(c.id); };
        grid.appendChild(btn);
      });
      wrapper.appendChild(grid);
      root.appendChild(wrapper);
    }
    let renderCurrencyRunning = false;
    async function renderCurrency(id) {
      if(renderCurrencyRunning) return;
      renderCurrencyRunning = true;
      try{
        const cur = data.currencies.find(x => x.id === id);
        if (!cur) {
          root.innerHTML = `<div class="section-title">${t('notFound')}</div>`;
          return;
        }
        const curName = currentLang === 'zh' ? cur.name : (cur.nameEn || cur.name);
        document.title = `CMB - ${curName}`;
        root.innerHTML = `<div class="section-title">${escapeHtml(curName)}</div>`;
        if (cur.note) {
          const noteText = currentLang === 'zh' ? cur.note : (cur.noteEn || cur.note);
          root.innerHTML += `<div class="detail"><div class="meta">${escapeHtml(noteText)}</div></div>`;
          return;
        }
        let branchesData;
        try {
          branchesData = await getBranches();
        } catch (e) {
          console.error('get branches failed', e);
          root.innerHTML += `<div class="note">${t('fetchBranchesError')}</div>`;
          return;
        }
        const norm = s => s ? String(s).replace(/[\u200B\uFEFF\u00A0]/g, ' ').replace(/\s+/g, ' ').trim().toLowerCase() : '';
        const targetNames = Array.from(new Set((cur.branches || []).map(n => norm(n))));
        let items = (branchesData || []).filter(b => targetNames.includes(norm(b.name)));
        const seen = new Set();
        items = items.filter(b => {
          const k = norm(b.name);
          if (seen.has(k)) return false;
          seen.add(k);
          return true;
        });
        let userPos = null;
        function getPositionPromise(timeout = 8000) {
          return new Promise((resolve) => {
            if (!navigator.geolocation) return resolve(null);
            let resolved = false;
            const timer = setTimeout(() => { if (!resolved) { resolved = true; resolve(null); } }, timeout);
            navigator.geolocation.getCurrentPosition(pos => {
              if (resolved) return;
              resolved = true; clearTimeout(timer);
              resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude });
            }, err => {
              if (resolved) return;
              resolved = true; clearTimeout(timer);
              resolve(null);
            }, { enableHighAccuracy: true, maximumAge: 60000, timeout: timeout });
          });
        }
        userPos = await getPositionPromise(8000);
        if(!userPos) {
          root.innerHTML += `<div class="note">${t('noLocation')}</div>`;
        }
        const enrichedItems = items.map(b => {
          const item = {...b};
          if(userPos && isFinite(item.lat) && isFinite(item.lng) && isInShenzhen(item.lat, item.lng)){
            const d = Math.round(haversine(userPos.lat, userPos.lng, item.lat, item.lng));
            item._distance_m = d;
            item._distance_text = d < 1000 ? `${d} m` : `${(d/1000).toFixed(2)} km`;
          }else if(!userPos){
            item._distance_m = null;
            item._distance_text = t('noLocationPerm');
          }else{
            item._distance_m = null;
            item._distance_text = t('coordError');
          }
          return item;
        });
        enrichedItems.sort((a,b) => {
          if (a._distance_m == null && b._distance_m == null) return 0;
          if (a._distance_m == null) return 1;
          if (b._distance_m == null) return -1;
          return a._distance_m - b._distance_m;
        });
        const listEl = document.createElement('div');
        listEl.className = 'list';
        enrichedItems.forEach(b => {
          const item = document.createElement('div');
          item.className = 'branch-item';
          const left = document.createElement('div'); left.style.flex = '1';
          const branchName = currentLang === 'zh' ? b.name : (b.nameEn || b.name);
          const branchAddr = currentLang === 'zh' ? b.address : (b.addressEn || b.address);
          left.innerHTML = `<div class="branch-name">${escapeHtml(branchName)}</div><div style="color:#666;font-size:14px;margin-top:6px">${escapeHtml(branchAddr)}</div>`;
          const right = document.createElement('div'); right.style.display='flex'; right.style.flexDirection='column'; right.style.alignItems='flex-end';
          right.innerHTML = `<div style="font-size:14px;color:#333;font-weight:600">${escapeHtml(b._distance_text)}</div>
                             <div style="margin-top:8px;"><button class="action-btn" data-name="${encodeURIComponent(b.name)}">${t('viewDetail')}</button></div>`;
          item.appendChild(left); item.appendChild(right); listEl.appendChild(item);
        });
        root.appendChild(listEl);
        listEl.addEventListener('click', (ev) => {
          const btn = ev.target.closest('button.action-btn');
          if (!btn) return;
          const name = decodeURIComponent(btn.getAttribute('data-name'));
          location.hash = '#/branch/' + encodeURIComponent(name);
        });
      }finally{
        renderCurrencyRunning = false;
        // 自动弹出小招喵提示：下拉可以刷新
        setTimeout(() => {
          const toast = document.getElementById('mascotToast');
          if (toast) {
            toast.textContent = currentLang === 'zh' ? '下拉可以刷新网点哦~' : 'Pull down to refresh~';
            toast.classList.add('show');
            clearTimeout(window._autoTipTimer);
            window._autoTipTimer = setTimeout(() => {
              toast.classList.remove('show');
            }, 3000);
          }
        }, 500);
      }
    }
    async function renderBranch(name) {
      document.title = `CMB - ${name || 'Branch Details'}`;
      root.innerHTML = '';
      const wrapper = document.createElement('div');
      wrapper.className = 'container';
      wrapper.innerHTML = `<div class="section-title">${escapeHtml(name)}</div>`;
      root.appendChild(wrapper);
      let branchesData;
      try {
        branchesData = await getBranches();
      } catch (e) {
        console.error('get branches failed', e);
        wrapper.innerHTML += '<div class="note">无法获取网点数据，请稍后重试。</div>';
        return;
      }
      const norm = s => s ? String(s).replace(/[\u200B\uFEFF\u00A0]/g, ' ').replace(/\s+/g, ' ').trim().toLowerCase() : '';
      const targetNormName = norm(name);
      const info = branchesData.find(b => norm(b.name) === targetNormName);
      if (!info) {
        wrapper.innerHTML += '<div class="detail"><div class="meta">该网点信息未找到。</div></div>';
        return;
      }
      const card = document.createElement('div');
      card.className = 'detail';
      card.innerHTML = `
        <h2>${escapeHtml(currentLang === 'zh' ? info.name : (info.nameEn || info.name))}</h2>
        <div class="meta">
          <div><strong>${t('address')}：</strong><span>${escapeHtml(currentLang === 'zh' ? info.address : (info.addressEn || info.address))}</span></div>
          <div><strong>${t('phone')}：</strong>${escapeHtml(info.phone || '请致电95555或官网查询')}</div>
          <div><strong>${t('hours')}：</strong>${escapeHtml(formatHours(info.hours))}</div>
        </div>
        <div class="row">
          <button class="copy-btn">${t('copyAddress')}</button>
          <button class="phone-btn">${t('callPhone')}</button>
          <button class="nav-btn">${t('navAmap')}</button>
          <button class="checkStatusBtn">${t('checkStatus')}</button>
        </div>
        <div class="statusBox"></div>
      `;
      wrapper.appendChild(card);
      const copyBtn = card.querySelector('.copy-btn');
      if (copyBtn) {
        copyBtn.addEventListener('click', async () => {
          const copyText = '招商银行' + info.name + '\n' + info.address;
          try { await navigator.clipboard.writeText(copyText); copyBtn.textContent = t('copied'); setTimeout(()=>copyBtn.textContent=t('copyAddress'),1500); }
          catch(e){ alert('复制失败，请手动复制：' + copyText); }
        });
      }
      const phoneBtn = card.querySelector('.phone-btn');
      if (phoneBtn && info.phone) {
        phoneBtn.addEventListener('click', () => {
          window.location.href = 'tel:' + info.phone;
        });
      }
      const navBtnEl = card.querySelector('.nav-btn');
      if (navBtnEl) {
        navBtnEl.addEventListener('click', () => {
          const nameEnc = encodeURIComponent('招商银行' + info.name);
          // 高德 URI 格式：to=经度,纬度,名称
          const uri = `https://uri.amap.com/navigation?to=${info.lng},${info.lat},${nameEnc}&mode=car&src=webapp&callnative=1`;
          window.open(uri, '_blank');
        });
      }
      const statusBoxEl = card.querySelector('.statusBox');
      const checkStatusBtnEl = card.querySelector('.checkStatusBtn');
      if (checkStatusBtnEl) {
        checkStatusBtnEl.addEventListener('click', async () => {
          if (statusBoxEl) statusBoxEl.textContent = t('statusLoading');
          try {
            const r = await fetch('/api/status?branch=' + encodeURIComponent(info.name));
            const j = await r.json();
            if (!j.ok) { if (statusBoxEl) statusBoxEl.textContent = t('statusFailed'); console.error(j); return; }
            const wd = (j.now.weekdayKey && i18n[currentLang].weekday[j.now.weekdayKey]) || j.now.weekday;
            if (statusBoxEl) {
              let countdownHtml = '';
              if (j.isOpen && j.openPeriod && j.openPeriod.close) {
                countdownHtml = `<div id="countdownBox" style="color:#FF6A00;font-weight:bold;margin-top:4px;"></div>`;
              }
              statusBoxEl.innerHTML = `<div>${t('currentTime')}: ${wd} ${String(j.now.hour).padStart(2,'0')}:${String(j.now.minute).padStart(2,'0')}</div>
                                 <div>${t('businessStatus')}: <strong style="color:${j.isOpen ? '#0a0' : '#a00'}" class="${j.isOpen ? 'status-open' : ''}">${j.isOpen ? t('statusOpen') : t('statusClosed')}</strong></div>
                                 <div>${t('todayHours')}: ${j.openPeriod ? (j.openPeriod.open + ' - ' + j.openPeriod.close) : t('noSpecificHours')}</div>
                                 ${countdownHtml}`;
              // 启动倒计时
              if (j.isOpen && j.openPeriod && j.openPeriod.close) {
                const closeParts = j.openPeriod.close.split(':');
                const closeHour = parseInt(closeParts[0]) || 17;
                const closeMin = parseInt(closeParts[1]) || 0;
                function updateCountdown() {
                  const now = new Date();
                  const closeTime = new Date();
                  closeTime.setHours(closeHour, closeMin, 0, 0);
                  let diff = closeTime - now;
                  const cdEl = document.getElementById('countdownBox');
                  if (!cdEl) return;
                  if (diff <= 0) {
                    cdEl.textContent = currentLang === 'zh' ? '即将下班，请尽快办理' : 'Closing soon';
                    return;
                  }
                  const hours = Math.floor(diff / 3600000);
                  const mins = Math.floor((diff % 3600000) / 60000);
                  const secs = Math.floor((diff % 60000) / 1000);
                  cdEl.textContent = (currentLang === 'zh' ? '距离下班还有 ' : 'Closes in ') + hours + 'h ' + mins + 'm ' + secs + 's';
                }
                updateCountdown();
                if (window._countdownTimer) clearInterval(window._countdownTimer);
                window._countdownTimer = setInterval(updateCountdown, 1000);
              } else {
                if (window._countdownTimer) { clearInterval(window._countdownTimer); window._countdownTimer = null; }
              }
            }
          } catch (e) {
            if (statusBoxEl) statusBoxEl.textContent = t('statusError');
            console.error(e);
          }
        });
      }
    }
  } catch (err) {
    console.error('Fatal error initializing app', err);
    try { showFatal(err.stack || err.message || err); } catch(e){}
  }</script>
  <div class="mascot-container">
    <img src="/assets/3.gif" alt="小招喵" class="mascot-fixed" id="mascotFixed" loading="lazy" decoding="async">
  </div>
  <div class="mascot-toast" id="mascotToast"></div>
</body>
