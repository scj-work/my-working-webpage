<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>招商银行深圳市外币兑换地图信息表</title>
  <style>
    html,body { height:100%; margin:0; font-family:"楷体","KaiTi",serif; background:#ffffff; color:#222; font-size:16px; -webkit-font-smoothing:antialiased; }
    .app { display:flex; flex-direction:column; height:100vh; }
    header { padding:12px 16px; display:flex; align-items:center; gap:12px; border-bottom:1px solid #eee; background:#fff; position:sticky; top:0; z-index:10; }
    .app-body { flex:1; overflow:auto; padding:16px; }
    .section-title { font-size:20px; font-weight:bold; margin:12px 0 16px; }
    .detail { border:1px solid #e5e7eb; border-radius:8px; padding:16px; margin-bottom:14px; background:#fff; }
    .meta > div { margin:6px 0; line-height:1.6; }
    .source { font-size:13px; color:#555; margin-top:8px; }
    .row { display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; }
    button { padding:8px 14px; border-radius:6px; border:1px solid #ccc; background:#f7f7f7; cursor:pointer; font-size:15px; }
    button:active { background:#e9e9e9; }
    .note { color:#b91c1c; padding:10px; }
    .statusBox { margin-top:10px; font-size:14px; line-height:1.6; }
    .branch-item { border:1px solid #ddd; border-radius:8px; padding:12px; margin-bottom:10px; cursor:pointer; }
    .branch-item:hover { background:#f6f6f6; }
    .distance-tag { font-size:13px; color:#2563eb; }
  </style>
</head>
<body>
<div class="app">
  <header>
    <h1 style="margin:0;font-size:18px">深圳招行外币兑换网点</h1>
  </header>
  <div class="app-body" id="root"></div>
</div>

<script>
const root = document.getElementById('root');
let renderCurrencyRunning = false;
let branchesCache = null; // 缓存接口返回网点数据
let userLocation = null; // 用户定位 {lat,lng}

// 工具：HTML转义
function escapeHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}

// 工具：格式化营业时间
function formatHours(h) {
  if(!h) return '未公示';
  let out = [];
  if(h.weekdays) out.push(`工作日 ${h.weekdays.open}-${h.weekdays.close}`);
  if(h.saturday) out.push(`周六 ${h.saturday.open}-${h.saturday.close}`);
  if(!h.sunday) out.push('周日休息');
  return out.join('；');
}

// Haversine公式：计算两点球面距离，返回单位：米
function calcDistanceM(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const rad = Math.PI / 180;
  const φ1 = lat1 * rad;
  const φ2 = lat2 * rad;
  const Δφ = (lat2‑lat1) * rad;
  const Δλ = (lon2‑lon1) * rad;
  const a = Math.sin(Δφ/2)**2 + Math.cos(φ1)*Math.cos(φ2)*Math.sin(Δλ/2)**2;
  return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1‑a)));
}

// 获取网点接口数据
async function fetchBranches() {
  if(branchesCache) return branchesCache;
  const res = await fetch("/api/branches");
  const json = await res.json();
  if(!json.ok) throw new Error("网点接口返回异常");
  branchesCache = json.branches;
  return branchesCache;
}

// 请求浏览器GPS用户定位
function getUserPosition() {
  return new Promise((resolve, reject) => {
    if(!navigator.geolocation) return reject(new Error("你的浏览器不支持定位"));
    navigator.geolocation.getCurrentPosition(
      (pos)=>{
        userLocation = {
          lat: pos.coords.latitude,
          lng: pos.coords.longitude
        };
        resolve(userLocation);
      },
      (err)=> reject(err),
      {enableHighAccuracy:true, timeout:10000, maximumAge:60000}
    )
  })
}

// 渲染网点详情页 hash=#网点名
async function renderBranch(name) {
  document.title = `招商银行 - ${escapeHtml(name || '网点详情')}`;
  root.innerHTML = '';
  const wrapper = document.createElement('div');
  wrapper.className = 'container';
  wrapper.innerHTML = `<div class="section-title">${escapeHtml(name)}</div>`;
  root.appendChild(wrapper);

  const norm = s => s ? String(s).replace(/[\u200B\uFEFF\u00A0]/g, ' ').replace(/\s+/g, ' ').trim().toLowerCase() : '';
  const targetNormName = norm(name);
  const branches = await fetchBranches();
  const info = branches.find(b => norm(b.name) === targetNormName);

  if (!info) {
    wrapper.innerHTML += '<div class="note">该网点信息未找到。</div>';
    return;
  }

  const card = document.createElement('div');
  card.className = 'detail';
  card.innerHTML = `
    <h2>${escapeHtml(info.name)}</h2>
    <div class="meta">
      <div><strong>地址：</strong><span>${escapeHtml(info.address)}</span></div>
      <div><strong>联系方式：</strong>${escapeHtml(info.phone || '请致电95555或官网查询')}</div>
      <div><strong>营业时间：</strong>${escapeHtml(formatHours(info.hours))}</div>
      <div class="source"><strong>主要来源：</strong>${escapeHtml((info.source||[]).map(s=>s.title).join(' / '))}</div>
    </div>
    <div class="row">
      <button class="copy-btn">复制地址</button>
      <button class="nav-btn">高德导航</button>
      <button class="checkStatusBtn">查看实时营业状态</button>
      <button class="backListBtn">返回网点列表</button>
    </div>
    ${(info.lat!=null && info.lng!=null) ? `<div style="margin-top:8px;color:#666;font-size:13px;">经纬度：${info.lng}, ${info.lat}</div>` : ''}
    <div class="statusBox"></div>
  `;
  wrapper.appendChild(card);

  card.querySelector('.backListBtn').addEventListener('click',()=>{
    window.location.hash = "";
  })

  const copyBtn = card.querySelector('.copy-btn');
  copyBtn.addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(info.address); copyBtn.textContent = '已复制 ✓'; setTimeout(()=>copyBtn.textContent='复制地址',1500); }
    catch(e){ alert('复制失败，请手动复制：' + info.address); }
  });

  const navBtnEl = card.querySelector('.nav-btn');
  navBtnEl.addEventListener('click', () => {
    const hasValidCoord = info.lat != null && info.lng != null
      && isFinite(info.lat) && isFinite(info.lng)
      && Math.abs(info.lat) > 0.001 && Math.abs(info.lng) > 0.001;

    if (hasValidCoord) {
      const pos = `${info.lng},${info.lat}`;
      const titleEnc = encodeURIComponent(info.name);
      const nativeUri = `amapuri://poi?position=${pos}&name=${titleEnc}`;
      const webUri = `https://uri.amap.com/marker?position=${pos}&name=${titleEnc}&coordinate=gaode&callnative=1`;
      const newWin = window.open(nativeUri, '_blank');
      setTimeout(() => {
        if(!newWin || newWin.closed || newWin.location.href === 'about:blank'){
          window.open(webUri,'_blank');
        }
      },350);
    } else {
      const addrEnc = encodeURIComponent(info.address || info.name);
      const uri = `https://uri.amap.com/search?query=${addrEnc}&callnative=1`;
      window.open(uri, '_blank');
    }
  });

  const statusBoxEl = card.querySelector('.statusBox');
  const checkStatusBtnEl = card.querySelector('.checkStatusBtn');
  checkStatusBtnEl.addEventListener('click', async () => {
    statusBoxEl.textContent = '查询网点实时营业状态中...';
    try {
      const r = await fetch('/api/status?branch=' + encodeURIComponent(info.name));
      const j = await r.json();
      if (!j.ok) { statusBoxEl.textContent = '状态查询失败'; return; }
      statusBoxEl.innerHTML = `
        <div>服务器时间（Asia/Shanghai）：${j.now.weekday} ${String(j.now.hour).padStart(2,'0')}:${String(j.now.minute).padStart(2,'0')}</div>
        <div>营业状态：<strong style="color:${j.isOpen ? '#0a0' : '#a00'}">${j.isOpen ? '营业中' : '已关闭'}</strong></div>
        <div>今日时段：${j.openPeriod ? (j.openPeriod.open + ' - ' + j.openPeriod.close) : '无明确时段'}</div>`;
    } catch (e) {
      statusBoxEl.textContent = `接口请求异常：${e.message}`;
    }
  });
}

// 渲染网点列表首页：无hash，优先使用用户定位按距离排序
async function renderListPage() {
  root.innerHTML = `<div class="section-title">加载网点中...</div>`;
  let branches = await fetchBranches();

  // 如果拿到用户定位，给每个网点增加距离，并排序（近→远）
  if(userLocation) {
    branches = branches.map(b=>{
      let dist = null;
      if(b.lat && b.lng){
        dist = calcDistanceM(userLocation.lat, userLocation.lng, b.lat, b.lng);
      }
      return {...b, distanceM:dist}
    })
    // 距离升序，无距离数据放最后
    branches.sort((a,b)=>{
      if(a.distanceM===null) return 1;
      if(b.distanceM===null) return -1;
      return a.distanceM - b.distanceM;
    })
  }

  root.innerHTML = `
    <div class="section-title">网点列表
      <div style="font-size:14px;font-weight:normal;margin:4px 0;">
        ${userLocation ? "✅已获取您的位置，按距离由近到远排序" : "⚠️未获取定位，按原始顺序展示，点击按钮请求定位"}
      </div>
      <button id="requestLocBtn">请求获取我的位置</button>
    </div>
    <div id="listWrap"></div>
  `
  const listWrap = document.getElementById('listWrap');
  branches.forEach(br=>{
    let distText = "";
    if(br.distanceM != null){
      if(br.distanceM>1000){
        distText = `<span class="distance-tag">距离 ${(br.distanceM/1000).toFixed(2)} km</span>`
      }else{
        distText = `<span class="distance-tag">距离 ${br.distanceM.toFixed(0)} m</span>`
      }
    }
    const item = document.createElement('div');
    item.className = "branch-item";
    item.innerHTML = `
      <div><strong>${escapeHtml(br.name)}</strong> ${distText}</div>
      <div style="font-size:14px;color:#444;margin-top:4px;">${escapeHtml(br.address)}</div>
    `
    item.onclick = ()=>{
      window.location.hash = encodeURIComponent(br.name);
    }
    listWrap.appendChild(item);
  })

  document.getElementById('requestLocBtn').onclick = async ()=>{
    try{
      await getUserPosition();
      await renderListPage();
    }catch(err){
      alert("定位失败："+err.message);
    }
  }
}

// 总入口
async function renderCurrency() {
  if(renderCurrencyRunning) return;
  renderCurrencyRunning = true;
  try {
    const hash = window.location.hash.slice(1);
    if(!hash){
      await renderListPage();
    }else{
      await renderBranch(decodeURIComponent(hash));
    }
  } catch(err) {
    console.error('应用加载错误：', err);
    root.innerHTML = `<div class="note">应用加载错误：${escapeHtml(err.message)}</div>`;
  } finally {
    renderCurrencyRunning = false;
  }
}

window.addEventListener('hashchange', ()=>{ renderCurrency(); });
window.addEventListener('DOMContentLoaded', ()=>{ renderCurrency(); });
</script>
</body>
</html>
